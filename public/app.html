<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DO OR DIE - Accountability Ledger | Track Daily Tasks</title>
<meta name="description" content="Sign in to your DO OR DIE accountability ledger. Track daily tasks, build streaks, and face your unforgiving accountability score. No editing the past.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111111">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Spectral+SC:wght@600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script>
  (function(){
    var t = localStorage.getItem('theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', t);
    var mc = document.querySelector('meta[name="theme-color"]');
    if(mc) mc.setAttribute('content', t === 'dark' ? '#0c0c0c' : '#111111');
  })();
</script>
</head>
<body>

<!-- ============================ LOADER ============================ -->
<div id="loader">
  <div>
    <div class="loader-mark">
      <span class="ld-word ld-do" data-text="DO">&nbsp;</span><span class="ld-or">or</span><span class="ld-word ld-die" data-text="DIE">&nbsp;</span>
    </div>
    <div class="loader-sub">Accountability Ledger</div>
  </div>
</div>

<!-- ============================ LOGIN ============================ -->
<div id="login-screen">
  <button class="btn btn-icon theme-toggle-btn login-theme-toggle" aria-label="Toggle theme" title="Toggle theme">
    <svg class="theme-icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
    <svg class="theme-icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
  </button>
  <div class="login-card">
    <div class="wordmark">Do or Die</div>
    <div class="wordmark-sub" id="login-sub">Accountability Ledger</div>

    <div class="field hidden" id="name-field">
      <label for="login-name">Display Name</label>
      <input type="text" id="login-name" autocomplete="name">
    </div>
    <div class="field" id="email-field">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" autocomplete="username">
    </div>
    <div class="field" id="password-field">
      <label for="login-password" id="password-label">Password</label>
      <input type="password" id="login-password" autocomplete="current-password">
    </div>
    <button class="btn btn-filled btn-block" id="login-btn">Sign In</button>
    <div class="error-text hidden" id="login-error">Incorrect email or password.</div>
    <div class="lock-note hidden" id="login-success" style="color:var(--ink); margin-top:8px;"></div>
    
    <div class="auth-nav">
      <a href="#" id="mode-toggle" style="color:var(--stamp); text-decoration:underline;">New here? Create account</a>
      <a href="#" id="forgot-toggle" style="color:var(--gray-4); text-decoration:underline;">Forgot password?</a>
    </div>

    <p class="login-tenet">"You can improve tomorrow.<br>You cannot rewrite yesterday."</p>
  </div>
</div>

<!-- ============================ APP ============================ -->
<div id="app" class="hidden">
  <div id="app-header">
    <div class="header-inner">
      <div class="header-mark">Do or Die</div>
      <div class="header-right">
        <span class="header-role" id="header-role"></span>
        <button class="btn btn-ghost hidden" id="my-day-btn">My Day</button>
        <button class="btn btn-icon theme-toggle-btn" aria-label="Toggle theme" title="Toggle theme">
          <svg class="theme-icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          <svg class="theme-icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
        <button class="btn btn-ghost" id="logout-btn">Log Out</button>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div id="user-view" class="hidden"></div>
    <div id="admin-view" class="hidden"></div>
    <div class="footer-note">no editing the past.</div>
  </div>
</div>

<div id="modal-root"></div>

<!-- JS modules (order matters: dependencies first) -->
<script src="js/api.js"></script>
<script src="js/dates.js"></script>
<script src="js/state.js"></script>
<script src="js/ui-helpers.js"></script>
<script src="js/chart.js"></script>
<script src="js/loader.js"></script>
<script src="js/dashboard-user.js"></script>
<script src="js/dashboard-admin.js"></script>
<script src="js/app.js"></script>
</body>
</html>
